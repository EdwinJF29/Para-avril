<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Quieres ser mi San Valentín? 💗</title>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <canvas id="heart-canvas"></canvas>

    <div class="container">
        <div class="glass-card">
            <h1 class="title">Sé que no es lo más romántico o lindo, pero..</h1>
            <p id="typing-text" class="message"></p>
            
            <div class="btn-group">
                <button id="yes-btn" class="btn yes-btn">Por supuesto que si</button>
                <button id="no-btn" class="btn no-btn">No</button>
            </div>
            
            <div id="success-msg" class="hidden">
                <h2>Siempre supe que dirías que si</h2>
                <p>No estabas para nada obligada xd</p>
                <p>Te quiero mucho mi corazón <3</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
